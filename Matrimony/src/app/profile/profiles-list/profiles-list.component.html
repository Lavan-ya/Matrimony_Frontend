<div class="container-fluid">
<h3 class="prof">List of Profiles</h3>
<br>
<table class="table table-striped table-hover">
<thead class="text">
    <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Caste</th>
    <th>Image</th>
</tr>
</thead>
<tbody>
    <tr *ngFor="let profile of profileListPayload">
        <td class="decor" (click)="goToIndividualProfile(profile.id)">{{profile.id}}</td>
        <td>{{profile.name}}</td>
        <td>{{profile.age}}</td>
        <td>{{profile.caste}}</td>
        <td class ="profile-image">
            <img *ngIf="profile.image" [src]="'data:image/jpeg;base64,' + profile.image"  class="profile-image">
          </td>
    </tr>
</tbody>
</table>
</div>
